name: Guardrails
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate project records and safety fixtures
        run: node --test tests/*.test.mjs
      - name: Validate public data when present
        run: node scripts/check-project-data.mjs
